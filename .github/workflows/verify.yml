# =============================================================================
#  tree-sitter-vbnet · GitHub Actions
# -----------------------------------------------------------------------------
#  File                verify.yml
#  Workflow name       Verify
#  Type                Entrypoint (runs in this repo only)
#  Triggers            pull_request
#                      push (dev, main)
#                      workflow_dispatch
#  Purpose             Regenerate the parser from grammar.js and fail on any
#                      drift in the generated parser or the committed
#                      node-kind snapshot, lint and format-check the grammar
#                      and tooling JavaScript, run the corpus and highlight
#                      tests, parse every fixture and fail on any
#                      ERROR/MISSING/zero-width node, hold the generated
#                      parser to its keyword and state-count budget, compile
#                      the scanner with warnings as errors, fuzz incremental
#                      reparsing, build and test the Rust, Node, Python, and
#                      Go bindings,
#                      validate the PR title, scan the working tree and Git
#                      history for secrets, and lint workflow/YAML files. A final aggregate job rolls every
#                      check up into a single `Verify` status for branch
#                      rulesets to require.
#
#                      On a pull request, a changes job decides what the
#                      change needs (tools/ci-policy.mjs): a docs-only change,
#                      or a title or body edit of a head that already passed,
#                      skips the grammar and Node binding jobs, and the Windows
#                      binding leg runs only for changes it can see
#                      differently. The aggregate job accepts exactly those
#                      skips.
#
#                      workflow_dispatch lets a maintainer run the checks by
#                      hand on any branch.
# =============================================================================

name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # A PR title/body edit must never cancel an in-flight build of this head.
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      build: ${{ steps.paths.outputs.build }}
      windows: ${{ steps.paths.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed paths are a diff between the base and head commits.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      # A title or body edit builds nothing new, but skipping is only safe when
      # the last completed Verify check for this head succeeded. A failed lookup
      # counts as no success, so the edit is planned from its changed paths
      # instead of failing.
      - name: Read the last Verify result for this head
        id: prior
        if: github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Verify&filter=all&per_page=100" \
            --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion // "none"'); then
            echo "::warning::Could not read earlier Verify results; planning from the changed paths"
            conclusion=none
          fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Decide which jobs the change needs
        id: paths
        env:
          PRIOR_VERIFIED: ${{ steps.prior.outputs.conclusion == 'success' }}
        run: node tools/ci-policy.mjs changes

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate conventional PR title
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            revert
            ci
            build
            security

  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Gitleaks
        id: cache-gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux-x64

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-release-tool
        with:
          repo: gitleaks/gitleaks
          tool: gitleaks
          version: ${{ env.GITLEAKS_VERSION }}
          asset: gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz

      - name: Scan the working tree with Gitleaks
        run: $HOME/.local/bin/gitleaks detect --no-git --redact --source . --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Scan Git history with Gitleaks
        run: $HOME/.local/bin/gitleaks detect --redact --source . --exit-code 1 --report-format json --report-path gitleaks-history-report.json

      - name: Upload redacted Gitleaks report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          # The history scan is often the step that fails, so upload both
          # reports — the working-tree one alone can be empty.
          path: |
            gitleaks-report.json
            gitleaks-history-report.json
          if-no-files-found: ignore

  verify:
    name: Grammar, fixtures, Rust build/test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch as of 2026-11-27; installs the current stable Rust (action itself publishes no version tags)
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the tree-sitter CLI
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli

      - name: Regenerate the parser from grammar.js
        run: npx --no-install tree-sitter generate

      - name: Fail if the generated parser is out of date
        run: git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json

      - name: Fail if the node-kind snapshot is out of date
        run: node tools/node-kinds.mjs --check

      - name: Fail if keyword extraction shrank or the parse table grew
        run: node tools/parser-budget.mjs

      - name: Lint the grammar and tooling JS
        run: npm run lint

      - name: Check formatting of the grammar and tooling JS
        run: npm run format:check

      - name: Test the tooling scripts
        run: node --test tools/*.test.mjs

      - name: Check Cargo.toml, package.json, and tree-sitter.json agree
        # gala refuses to plan a release when they disagree; failing here
        # catches the drift on the pull request instead of on main.
        run: node tools/release-policy.mjs versions

      - name: Run corpus and highlight tests
        run: npx --no-install tree-sitter test

      - name: Parse every fixture and fail on ERROR/MISSING or zero-width nodes
        run: node tools/fixture-check.mjs

      - name: Compile the scanner with warnings as errors
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -O2 -c -Isrc src/scanner.c -o /dev/null

      # The seed is random and printed in the log; set TREE_SITTER_SEED to
      # that value to replay a failure.
      - name: Fuzz incremental reparsing
        run: node tools/fuzz-check.mjs

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo build & test
        run: cargo test

      - name: Test the Python binding
        # Built from a copy: the build writes into `build/`, which would end up
        # beside the checkout's own files.
        run: |
          copy="$RUNNER_TEMP/python-binding"
          mkdir "$copy"
          git archive HEAD | tar -x -C "$copy"
          cd "$copy"
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --quiet ".[core]" "pytest~=9.2.0"
          .venv/bin/python -m pytest bindings/python/tests

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Test the Go binding
        run: go test ./bindings/go

      - name: Verify publishable package contents
        # The same crate and npm package checks release.yml runs before
        # publishing, so a packaging gap fails here first.
        run: node tools/package-check.mjs

      # Cargo resolves dev-dependencies even for `cargo check`, and the
      # `tree-sitter` one needs a newer compiler than the library does, so the
      # check runs on a copy with them removed. The checkout stays as it was,
      # which the cache's post-job save depends on.
      - name: Check the library builds on the declared minimum Rust version
        run: |
          copy="$RUNNER_TEMP/msrv"
          mkdir "$copy"
          git archive HEAD | tar -x -C "$copy"
          cd "$copy"
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          awk '/^\[/ { skip = /^\[dev-dependencies/ } !skip' Cargo.toml > Cargo.toml.library
          mv Cargo.toml.library Cargo.toml
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check

  node-binding:
    name: Node binding build/test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.windows == 'true' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install dependencies and build the native addon
        run: npm ci

      - name: Run the Node binding tests
        run: npm test

  workflow-meta:
    name: Workflow and YAML checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: '1.7.12'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-linux-amd64-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-release-tool
        with:
          repo: rhysd/actionlint
          tool: actionlint
          version: ${{ env.ACTIONLINT_VERSION }}
          asset: actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz

      - name: Run actionlint
        run: $HOME/.local/bin/actionlint -color -ignore 'SC[0-9]+:(info|style):'

      - name: Validate YAML files
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PYEOF'
          import sys
          import yaml
          from pathlib import Path

          ignored = {".git", "node_modules", "target", "dist"}
          failures = []
          for path in Path(".").rglob("*.y*ml"):
              if any(part in ignored for part in path.parts):
                  continue
              try:
                  with path.open("r", encoding="utf-8") as f:
                      list(yaml.safe_load_all(f))
              except yaml.YAMLError as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("Invalid YAML found:")
              for failure in failures:
                  print(f"  {failure}")
              sys.exit(1)
          print("All YAML files parsed cleanly.")
          PYEOF

  ci:
    # A dispatched run must report as `Verify` too: it is how a
    # GITHUB_TOKEN-pushed release or sync branch satisfies the required check.
    name: ${{ github.event_name == 'push' && 'Verify (push)' || 'Verify' }}
    needs: [changes, verify, node-binding, secret-scanning, pr-title, workflow-meta]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Require every job to succeed or be a planned skip
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node tools/ci-policy.mjs verify
