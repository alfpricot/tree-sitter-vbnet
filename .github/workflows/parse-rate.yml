# =============================================================================
#  tree-sitter-vbnet · GitHub Actions
# -----------------------------------------------------------------------------
#  File                parse-rate.yml
#  Workflow name       Parse rate
#  Type                Entrypoint (runs in this repo only)
#  Triggers            schedule (monthly)
#                      workflow_dispatch
#  Purpose             Measure how many files of public VB.NET code parse with
#                      no ERROR or MISSING node: sparse, shallow checkouts of
#                      dotnet/samples, dotnet/docs, and the VB compiler sources
#                      in dotnet/roslyn. The report goes to the run summary and
#                      is uploaded as an artifact. It is a measurement and
#                      gates nothing.
# =============================================================================

name: Parse rate

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parse-rate
  cancel-in-progress: false

jobs:
  parse-rate:
    name: Parse rate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Install the tree-sitter CLI
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli

      - name: Check out the public corpora
        run: |
          clone() {
            local dir="$RUNNER_TEMP/$1"
            git clone --depth 1 --filter=blob:none --no-checkout "https://github.com/dotnet/$1.git" "$dir"
            git -C "$dir" sparse-checkout set --no-cone "$2"
            git -C "$dir" checkout
          }
          clone samples '*.vb'
          clone docs '*.vb'
          clone roslyn '/src/Compilers/VisualBasic/Portable/**/*.vb'

      - name: Measure the parse rate
        run: |
          node tools/parse-rate.mjs \
            "samples=$RUNNER_TEMP/samples" \
            "docs=$RUNNER_TEMP/docs" \
            "roslyn=$RUNNER_TEMP/roslyn/src/Compilers/VisualBasic/Portable" \
            --out parse-rate.md
          cat parse-rate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parse-rate
          path: parse-rate.md
