# =============================================================================
#  tree-sitter-vbnet · GitHub Actions
# -----------------------------------------------------------------------------
#  File                release.yml
#  Workflow name       Release
#  Type                Entrypoint (runs in this repo only)
#  Triggers            push (tags: v*)
#                      workflow_dispatch (tag input)
#  Purpose             Publishes the crate to crates.io and the npm package
#                      to the public npm registry and to GitHub Packages for
#                      the given tag, then creates the corresponding GitHub
#                      Release. The tag must point at a commit on main whose
#                      Cargo.toml, package.json, and tree-sitter.json
#                      versions all match it; the release policy script
#                      validates that before anything is published.
#                      GitHub Packages requires an npm package name scoped to
#                      the repository owner, so that job publishes under
#                      @<owner>/tree-sitter-vbnet in its own short-lived
#                      checkout only; the public npm package stays unscoped.
#                      crates.io and the public npm registry use trusted
#                      publishing: each job exchanges its OIDC token for a
#                      short-lived publish token, so no registry token is
#                      stored. Both jobs run in the publish environment,
#                      which admits only v* tags, so a manual dispatch has to
#                      select the tag as its ref. Both registries match the
#                      publisher on this file's name and that environment, so
#                      renaming either stops publishing until their settings
#                      are updated.
#                      Prebuilt native addons (Linux and Windows, Node-API)
#                      are built by the prebuild matrix job and published
#                      inside the npm and GitHub Packages tarballs, so an
#                      install on those platforms needs no C toolchain;
#                      node-gyp-build prefers a matching prebuild over a
#                      source build. No registry publish runs unless every
#                      prebuild succeeded, and each npm publish also requires
#                      the package to list a binary for each platform. A
#                      WASM build is attached to the GitHub
#                      Release for web-tree-sitter consumers, along with
#                      test/node-kinds.txt as the node-kind stability
#                      surface (only if the checkout has it — an older tag
#                      re-dispatched by hand can predate it) and the report
#                      from the newest successful Parse rate run that measured
#                      a commit the release contains, when one still has its
#                      artifact.
#
#                      A short resolve job validates the tag first, so the
#                      prebuild and WASM jobs run beside the full re-verify
#                      instead of after it. Every publish job still requires
#                      that re-verify to pass.
#
#                      The workflow_dispatch trigger exists because
#                      gala-release.yml's release commit carries a skip-ci
#                      marker, which can also suppress the tag-push trigger;
#                      gala-release.yml dispatches this workflow with the tag
#                      gala just pushed instead. The tag-push trigger covers a
#                      v* tag pushed without that marker; the tag ruleset
#                      lets only the release deploy key create one. GitHub
#                      only registers a workflow once a push has triggered it
#                      or changed its file, so in a new repository this file
#                      needs one change on the default branch before that
#                      dispatch can find it.
#
#                      gala writes every version file (Cargo.toml,
#                      package.json, tree-sitter.json, pyproject.toml) and
#                      regenerates the parser in the release commit, so the
#                      publish jobs use the tagged files as committed. Every
#                      publish step is safe to repeat: it checks whether the
#                      version is already live before publishing.
# =============================================================================

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      policy: ${{ steps.release.outputs.policy }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release validation from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Resolve a release tag on main and check its version files
        id: release
        run: node tools/release-policy.mjs resolve

  verify:
    name: Verify before publishing
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Checkout the package check from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.policy }}
          path: .release-tools
          sparse-checkout: tools/package-check.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Move the package check out of the checkout
        # Left in place it would show up in the package listing it validates.
        run: |
          cp .release-tools/tools/package-check.mjs "$RUNNER_TEMP/release-package-check.mjs"
          rm -rf .release-tools
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch as of 2026-11-27; installs the current stable Rust (action itself publishes no version tags)
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Regenerate the parser from grammar.js
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
          npx --no-install tree-sitter generate
      - name: Fail if the generated parser is out of date
        run: git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json
      - name: Run corpus and highlight tests
        run: npx --no-install tree-sitter test
      - name: Verify package contents
        run: node "$RUNNER_TEMP/release-package-check.mjs"
      - name: Cargo build & test
        run: cargo test
      - name: Build the packaged crate
        # publish-crate skips cargo's own verification build, so no build
        # script runs in a job that can mint a publish token.
        run: cargo package -p tree-sitter-vbnet

  prebuild:
    name: Prebuild native addon (${{ matrix.os }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install dependencies
        # prebuildify and its dependencies come from package-lock.json, so
        # the tool that produces the published binaries is pinned throughout.
        # --ignore-scripts skips this package's own "install":
        # "node-gyp-build" script, which would otherwise try (and fail, since
        # there's nothing built yet) to load the addon.
        run: npm ci --ignore-scripts
      - name: Build the native Node addon prebuild
        run: npx --no-install prebuildify --napi --strip
      - name: Upload the prebuild
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/
          if-no-files-found: error

  build-wasm:
    name: Build WASM
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      file: ${{ steps.wasm.outputs.file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Install the tree-sitter CLI
        # The CLI version comes from package-lock.json, the same one that
        # generates and verifies parser.c, so Dependabot bumps it in one place.
        run: |
          npm ci --ignore-scripts
          npm rebuild tree-sitter-cli
      - name: Build the WASM grammar
        run: npx --no-install tree-sitter build --wasm
      - name: Locate the WASM build
        id: wasm
        # The CLI names its output after the grammar's `name` in
        # tree-sitter.json, which need not match the package name.
        run: |
          set -euo pipefail
          name=$(node -p 'require("./tree-sitter.json").grammars[0].name')
          file="tree-sitter-${name}.wasm"
          test -f "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Upload the WASM build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-build
          path: ${{ steps.wasm.outputs.file }}
          if-no-files-found: error

  publish-crate:
    name: Publish to crates.io
    # The crate needs no prebuild, but publishing it alone would use up the
    # version on one registry while the npm publishes are blocked.
    needs: [resolve, verify, prebuild]
    environment: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch as of 2026-11-27; installs the current stable Rust (action itself publishes no version tags)
      - name: Check whether this version is already live
        id: crate
        run: |
          set -euo pipefail
          version="${TAG#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "tree-sitter-vbnet-release (${GITHUB_REPOSITORY})" "https://crates.io/api/v1/crates/tree-sitter-vbnet/${version}")
          if [ "$status" = "200" ]; then
            echo "tree-sitter-vbnet@${version} is already published, skipping"
          elif [ "$status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates.io lookup failed with HTTP ${status}" >&2
            exit 1
          fi
      - name: Get a short-lived crates.io token
        if: steps.crate.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # --no-verify: either registry accepts a token minted in this job,
        # so no dependency code may run here. The verify job builds the
        # packaged crate instead.
        run: cargo publish -p tree-sitter-vbnet --no-verify

  publish-npm:
    name: Publish to npm
    needs: [resolve, verify, prebuild]
    # Every prebuild leg must succeed: a published version cannot be replaced,
    # so a rerun could never add the missing binaries to it.
    environment: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.policy }}
          path: .release-tools
          sparse-checkout: |
            tools/release-policy.mjs
            tools/prebuild-check.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No registry-url: it writes an .npmrc that expects a stored
          # token. npm publishes to the public registry by default and gets
          # its own token from the job's OIDC token.
          node-version: '24.x'
      - name: Download the prebuilt native addons
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - name: Require a prebuild for every platform
        run: node .release-tools/tools/prebuild-check.mjs
      - name: Check the package versions match the tag
        id: package
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: node .release-tools/tools/release-policy.mjs check-npm
      - name: Publish (skip if this version is already live)
        env:
          PROVENANCE: ${{ steps.package.outputs.provenance }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if npm view "tree-sitter-vbnet@${version}" version >/dev/null 2>&1; then
            echo "tree-sitter-vbnet@${version} is already published, skipping"
          else
            npm publish --access public --provenance="$PROVENANCE"
          fi

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: [resolve, verify, prebuild]
    # Every prebuild leg must succeed: a published version cannot be replaced,
    # so a rerun could never add the missing binaries to it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # GitHub Packages requires the scope to match the repository owner;
      # deriving it keeps an ownership transfer from needing a workflow edit.
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.policy }}
          path: .release-tools
          sparse-checkout: |
            tools/release-policy.mjs
            tools/prebuild-check.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
      - name: Download the prebuilt native addons
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - name: Set the package name for GitHub Packages
        run: |
          set -euo pipefail
          npm pkg set "name=@${OWNER}/tree-sitter-vbnet"
          node .release-tools/tools/release-policy.mjs check-npm
      - name: Require a prebuild for every platform
        run: node .release-tools/tools/prebuild-check.mjs
      - name: Publish (skip if this version is already live)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if npm view "@${OWNER}/tree-sitter-vbnet@${version}" version >/dev/null 2>&1; then
            echo "@${OWNER}/tree-sitter-vbnet@${version} is already published, skipping"
          else
            npm publish --access public
          fi

  github-release:
    name: Create GitHub Release
    needs: [resolve, verify, publish-crate, publish-npm, publish-github-packages, build-wasm]
    # The release does not depend on the WASM build succeeding: a build-wasm
    # failure should not block release creation once every registry is live.
    # Only the three publish jobs are hard-required.
    if: ${{ !cancelled() && needs.publish-crate.result == 'success' && needs.publish-npm.result == 'success' && needs.publish-github-packages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Reading the latest Parse rate run and downloading its report.
      actions: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Download the WASM build
        if: needs.build-wasm.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
      - name: Attach the WASM build
        if: needs.build-wasm.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WASM_FILE: ${{ needs.build-wasm.outputs.file }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$WASM_FILE" --clobber

      - name: Attach the node-kind stability surface
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A manual re-dispatch can target a tag cut before this file
          # existed; upload it only when the checkout has it, so a recovery
          # run against an old tag does not fail the whole job.
          if [ -f test/node-kinds.txt ]; then
            gh release upload "$TAG" test/node-kinds.txt --clobber
          fi

      - name: Attach the parse-rate report
        # A measurement only: a missing report or a failed lookup must not
        # fail a release whose packages are already published.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          # The first report attached stays, so a rerun of this tag does not
          # change a published asset.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if grep -qx 'parse-rate.md' <<<"$assets"; then
            echo "parse-rate.md is already attached, skipping"
            exit 0
          fi
          # Newest first.
          runs=$(gh run list --workflow parse-rate.yml --branch dev --status success --limit 20 \
            --json databaseId,headSha,createdAt \
            --jq '.[] | "\(.databaseId) \(.headSha) \(.createdAt)"')
          found=
          while read -r run sha created; do
            [ -n "$run" ] || continue
            # Comparing measured...released, "ahead" or "identical" means the
            # release contains the measured commit.
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...${RELEASE_COMMIT}" --jq .status)
            if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
              found=1
              break
            fi
          done <<<"$runs"
          if [ -z "$found" ]; then
            echo "::notice::No successful Parse rate run measured a commit in this release"
            exit 0
          fi
          gh run download "$run" --name parse-rate --dir "$RUNNER_TEMP/parse-rate"
          report="$RUNNER_TEMP/parse-rate/parse-rate.md"
          printf '\nMeasured on %s at commit %s.\n' "${created%%T*}" "$sha" >> "$report"
          gh release upload "$TAG" "$report"
